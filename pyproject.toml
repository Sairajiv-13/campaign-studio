[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campaign-studio"
version = "0.1.0"
description = "Lifecycle Campaign Studio: generate and score personalized marketing campaigns per audience segment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "httpx==0.28.1",
    "langgraph==0.2.62",
    "pyjwt==2.10.1",
    "bcrypt==4.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM"]
# E501: handled by the formatter. B008: FastAPI Depends() in defaults is idiomatic.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests exercising the full pipeline in sandbox mode",
    "smoke: live tests against a real LLM (skipped when none is reachable)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
