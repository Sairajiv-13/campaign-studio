name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test · eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: |
          ruff check app tests evals
          ruff format --check app tests evals
      - name: Mypy
        run: mypy app evals
      # Hermetic: sandbox model, in-memory store, no secrets. Coverage gate here.
      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      # Regression gate: the scorer must agree with human A/B preference.
      - name: Scorer evaluation
        run: python -m evals --min-accuracy 0.8

  docker:
    name: build image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: campaign-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
