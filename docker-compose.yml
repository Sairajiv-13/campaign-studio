# Local stack. `docker compose up --build` starts the studio in sandbox mode
# (deterministic copy generator + judge) — no secrets, no model download.
#
# For real generation, start Ollama and flip the mode:
#   docker compose --profile llm up
#   docker compose exec ollama ollama pull llama3.1
#   LLM_MODE=real docker compose up
services:
  api:
    build: .
    env_file: .env
    environment:
      LLM_MODE: ${LLM_MODE:-sandbox}
      LLM_BASE_URL: http://ollama:11434/v1
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  # Observability stack (ADR-008). Opt-in: `docker compose --profile observability up`.
  # Prometheus scrapes the API's /metrics; Grafana auto-loads the bundled dashboard.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  ollamadata:
