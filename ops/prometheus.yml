# Prometheus scrape config for local observability (ADR-008).
# The API exposes Prometheus metrics at /metrics; point Grafana at this Prometheus
# and import ops/grafana/dashboards/campaign-studio.json.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: campaign-studio
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
